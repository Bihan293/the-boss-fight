name: Android APK Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      GODOT_VERSION: "4.4.1"
      GODOT_TAG: "4.4.1-stable"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -o /tmp/godot.zip -d /tmp/godot-bin

          GODOT_BIN="$(find /tmp/godot-bin -type f \
            -name 'Godot_v*-stable_linux.x86_64' | head -n 1)"

          test -n "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot-templates
          unzip -o /tmp/templates.tpz -d /tmp/godot-templates

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"

          godot --version
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android

          godot --headless --path . \
            --export-debug "Android" \
            build/android/TheBossFight.apk

          test -s build/android/TheBossFight.apk
          file build/android/TheBossFight.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheBossFight-Android
          path: build/android/TheBossFight.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            build/android/TheBossFight.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "The Boss Fight $GITHUB_REF_NAME" \
            --generate-notes
